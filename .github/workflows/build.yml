name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Extract project
        run: |
          mkdir project
          unzip -q AutoBotSimulator-AndroidProject.zip -d project

      - name: Build APK
        working-directory: project
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoBotSimulator-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
